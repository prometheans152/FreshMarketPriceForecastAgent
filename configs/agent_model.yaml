# TW01 代理人模型候選設定（T25 型號核實；第一輪 2026-10-03，F09 修訂輪 2026-10-03）
# 證據分三類並逐項標示：official（QwenLM GitHub／HF Qwen org）、
#   implementer（Unsloth 指南與 GGUF 工件——實作者資料，非 Qwen 官方權重）、
#   estimate（參數量推算／未驗證估計）。
# 顯存除標明來源者外均為推算或檔案大小，非官方 VRAM 需求數字，更非 3090 實測。
# 依第二輪獨立審查 F09 修訂：原「Qwen3.8 跑不動 3090」結論過度概括；
#   27B GGUF 4-bit（實作者資料 16–19GB）列為優先實測候選，使用者候選不排除。

verification:
  checked_at: "2026-10-03（第一輪＋F09 修訂輪）"
  revision_reason: >
    第二輪獨立審查（docs/reviews/ROUND2_7fdb43b_REVIEW.md F09）指出原結論
    「Qwen3.8 官方權重超24GB、不列入3090首選」被概括為「Qwen3.8 跑不動 3090」。
    本輪重新讀取官方 repo 與 Unsloth 來源，修訂結論並擴充候選；未下載任何權重。
  sources_official:
    - url: "https://github.com/QwenLM/Qwen3.8"
      read_status: "完整（F09 輪）"
      finding: "Local Use 段明列 llama.cpp（GGUF）並連結 unsloth.ai/docs/models/qwen3.8；開源檢查點僅 2.4T-A95B 與 27B"
    - url: "https://huggingface.co/Qwen/Qwen3.8-27B"
      read_status: "完整（F09 輪）"
      finding: "BF16 總檔 55,563,118,992 bytes（約55.6GB、18分片）；262,144 native context；Apache-2.0"
    - url: "https://huggingface.co/Qwen/Qwen3.8-27B-FP8"
      read_status: "完整（F09 輪）"
      finding: "總檔 30,867,004,263 bytes（約30.9GB ≈ 28.7GiB）；F8_E4M3 block 128；卡片未列硬體需求"
    - url: "https://huggingface.co/Qwen/Qwen3.5-9B"
      read_status: "完整（F09 輪）"
      finding: "--language-model-only 可跳過視覺編碼器釋出 KV cache；BF16 約19.3GB；vLLM/SGLang 需 main 分支"
    - url: "https://huggingface.co/collections/Qwen/qwen38"
      read_status: "完整（第一輪）；本輪未重抓"
      finding: "Qwen3.8 開源檢查點僅 2.4T-A95B 與 27B（各自 BF16/FP8）"
    - url: "https://huggingface.co/Qwen/Qwen3.5-4B"
      read_status: "完整（第一輪）；本輪未重抓"
      finding: "約4.66B、BF16 約9.3GB、Apache-2.0"
    - url: "https://huggingface.co/Qwen/Qwen3-8B"
      read_status: "完整（第一輪）；本輪未重抓"
      finding: "8.2B、BF16 約16.4GB、Apache-2.0、agent 能力明文"
  sources_implementer:
    - url: "https://unsloth.ai/docs/models/qwen3.8"
      read_status: "完整（F09 輪）"
      finding: "27B 4-bit 需求16-19GB；『For older GPUs, our GGUFs work well!』；NVFP4 需 Blackwell（RTX 50X/B200/B300）；MTP 另需1-2GB"
    - url: "https://huggingface.co/unsloth/Qwen3.8-27B-GGUF"
      read_status: "完整（F09 輪）"
      finding: "UD-Q4_K_M.gguf 16.5GB／UD-Q4_K_XL.gguf 17.6GB；mmproj 視覺檔另計；Apache-2.0；llama.cpp 執行；架構 qwen35 需較新版本"
