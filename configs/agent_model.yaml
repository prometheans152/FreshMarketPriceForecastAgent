# ---------- runtime（第四輪 D41 接線：供應商無關代理人設定） ----------
# 由 src/aiot_price/agent/providers.py 消費；環境變數 AIOT_AGENT_PROFILE 選擇（預設 rule）。
# 本段是「實際執行設定」；上方 direction 段是需求紀錄，兩者分開維護。
runtime:
  default_profile: rule            # 無金鑰/未設定時的安全預設（無 LLM）
  cloud_fallback: false            # qwen_local 失敗不自動切雲端（D41 明確要求）
  profiles:
    rule:
      kind: rule
      description: "無 LLM：確定性規則解析＋真工具＋模板回答（降級路徑，不需金鑰）"
    glm_zai:
      kind: openai_compat
      description: "GLM API（Z.AI 平台，OpenAI 相容）——需確認帳戶方案允許本專題使用情境"
      base_url: "https://api.z.ai/api/paas/v4"
      model: ""                     # 待使用者提供實際 model ID（如 glm-4.x 系列）
      api_key_env: AIOT_GLM_API_KEY
      timeout: 20
      max_tokens: 800
      max_tool_calls: 4
      max_turns: 4
      max_retries: 2
    glm_bigmodel:
      kind: openai_compat
      description: "GLM API（智譜 BigModel 平台，OpenAI 相容）——與 Z.AI 不互換，依使用者實際平台"
      base_url: "https://open.bigmodel.cn/api/paas/v4"
      model: ""
      api_key_env: AIOT_GLM_API_KEY
      timeout: 20
      max_tokens: 800
      max_tool_calls: 4
      max_turns: 4
      max_retries: 2
    qwen_local:
      kind: openai_compat
      description: "本機 Qwen3.8-27B 推論端點（SERVER_3090 部署後啟用；OpenAI 相容，如 llama.cpp/vLLM server）"
      base_url: "http://127.0.0.1:8080/v1"   # 佔位：實際位址待 SERVER 設定後替換
      model: "Qwen3.8-27B"
      api_key_env: ""               # 本機端點通常不需金鑰
      timeout: 60
      max_tokens: 800
      max_tool_calls: 4
      max_turns: 4
      max_retries: 1
      cloud_fallback: false

