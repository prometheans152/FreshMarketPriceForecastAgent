    Qwen3.8 為官方系列（2026-08），最小開源檢查點 27B dense。官方 BF16（約55.6GB）與
    官方 FP8（約30.9GB ≈ 28.7GiB）無法全放單卡24GB；但 27B GGUF 4-bit（實作者資料
    16-19GB；工件 UD-Q4_K_M 16.5GB／UD-Q4_K_XL 17.6GB）是值得 3090 實機測試的候選，
    尚未實測。使用者候選不排除，列為優先實測對象。NVFP4 需 Blackwell，3090（Ampere）
    不適用其數字。詳見 docs/QWEN_SERVER_BENCHMARK.md。

