# TW01 公開資料來源設定（T05）
# 採用原則：只列實際查核過的來源；「不採用」欄位保留查核結論，避免之後誤當訓練輸入。
# 單位與 0 值意義是資料契約的一部分，修改前先更新 docs/DATA_CARD.md 與 docs/DECISIONS.md。

sources:
  # ===== 採用：臺中市公有零售市場每日蔬果價格 =====
  taichung_retail_daily:
    adopted: true
    name: 臺中市政府公有零售市場每日蔬果價格
    dataset_id: "data.gov.tw/84539"
    page_url: https://data.gov.tw/dataset/84539
    download_url: https://newdatacenter.taichung.gov.tw/api/v1/no-auth/resource.download?rid=495aff49-3547-4055-aacd-f0781c6f733e
    format: json
    license: 政府資料開放授權條款-第1版
    unit_declared: "平均價格(元/斤)"
    unit_interpretation: 元/臺斤（1臺斤=0.6公斤，依標準檢驗局衡器規範4.8，2026-10-03查核）
    zero_means: 該品項當日無價格（缺測），非0元
    expected:
      key_fields: [市場名稱, 訪價日期]
      date_field: 訪價日期
      date_format: YYYYMMDD
      field_count: 63
      field_structure: 市場名稱＋訪價日期＋61個價格欄；61個價格欄含禽肉等品項，不是61種蔬菜
    notes:
      - 市場均價非單一店家真值，僅作公開行情參考
      - "(停)前綴為停用市場（如(停)建國市場），沿用價與營業狀態由T06品質報告認定"
      - 頁面後設資料稱13市場/近2個月，實檔為14市場/近一年，以實檔為準
      - 發布延遲未經實測確認；觀測日期不等於可下載日期（MODEL_VALIDATION_PLAN 3.3）

  # ===== 不採用：保留查核結論，防止之後誤用 =====
  taipei_market_monthly:
    adopted: false
    name: 臺北市公有零售市場月均價表
    reason: 月表沒有逐日訪價日期，無法建立以日曆日配對的7/14天標籤（MODEL_VALIDATION_PLAN 3.1）
    decision: 不採用：無逐日日期不能建7/14天標籤

  kaohsiung_market_daily:
    adopted: false
    name: 高雄市零售市場每日價格
    reason: 來源頁面已下架，下載連結回404（查核紀錄見docs/research/TW01_PUBLIC_RETAIL_DATA.md）
    decision: 不採用：已下架/404，失效來源不列為訓練輸入
