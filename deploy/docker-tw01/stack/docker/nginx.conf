# A minimal public web/UI + Docker MCP reverse proxy.
# Only loopback 8080 is published by Compose until separately TLS-terminated.
limit_req_zone $binary_remote_addr zone=tw01_website_perip:1m rate=12r/m;
limit_req_zone $binary_remote_addr zone=tw01_mcp_perip:1m rate=30r/m;

server {
    listen 8080 default_server;
    server_name _;
    server_tokens off;
    access_log off;
    client_max_body_size 4096;
    client_body_timeout 8s;
    keepalive_timeout 5s;
    send_timeout 20s;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    error_page 413 = @tw01_json_oversize;
    location @tw01_json_oversize {
        internal;
        default_type application/json;
        return 413 '{"error":{"code":"payload_too_large","message":"Request body exceeds limit."}}';
    }
    location @tw01_web_rate_limit {
        internal;
        default_type application/json;
        return 429 '{"error":{"code":"rate_limited","message":"請求過於頻繁，稍後再試。"}}';
    }
    location = / {
        return 302 /web/;
    }
    location = /web {
        return 308 /web/;
    }
    location = /web/ {
        alias /usr/share/nginx/tw01/;
        index index.html;
        add_header Cache-Control no-store always;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
        add_header X-Frame-Options DENY always;
    }
    location = /web/index.html {
        alias /usr/share/nginx/tw01/index.html;
        default_type text/html;
        add_header Cache-Control no-store always;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
        add_header X-Frame-Options DENY always;
    }
    location = /web/app.js {
        alias /usr/share/nginx/tw01/app.js;
        default_type application/javascript;
        add_header Cache-Control no-store always;
        add_header X-Content-Type-Options nosniff always;
    }
    location = /web/style.css {
        alias /usr/share/nginx/tw01/style.css;
        default_type text/css;
        add_header Cache-Control no-store always;
        add_header X-Content-Type-Options nosniff always;
    }
    location = /web/catalog.json {
        alias /usr/share/nginx/tw01/catalog.json;
        default_type application/json;
        add_header Cache-Control no-store always;
        add_header X-Content-Type-Options nosniff always;
    }
    location = /web/forecast {
        limit_except POST { deny all; }
        limit_req zone=tw01_website_perip burst=6 nodelay;
        limit_req_status 429;
        error_page 429 = @tw01_web_rate_limit;
        proxy_pass http://forecast:8767/site/forecast;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_set_header Authorization "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 20s;
        proxy_send_timeout 8s;
        proxy_buffering off;
    }
    location = /healthz {
        limit_except GET { deny all; }
        proxy_pass http://forecast:8767/healthz;
        proxy_connect_timeout 3s;
        proxy_read_timeout 21s;
    }
    location = /v1/forecast {
        limit_except POST { deny all; }
        proxy_pass http://forecast:8767/v1/forecast;
        proxy_connect_timeout 3s;
        proxy_read_timeout 20s;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_buffering off;
    }
    location = /v1/market-quote {
        limit_except POST { deny all; }
        proxy_pass http://forecast:8767/v1/market-quote;
        proxy_connect_timeout 3s;
        proxy_read_timeout 20s;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_buffering off;
    }
    location = /mcp {
        limit_req zone=tw01_mcp_perip burst=8 nodelay;
        limit_req_status 429;
        client_max_body_size 16k;
        proxy_pass http://mcp:9000/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_buffering off;
    }
    location / { return 404; }
}
