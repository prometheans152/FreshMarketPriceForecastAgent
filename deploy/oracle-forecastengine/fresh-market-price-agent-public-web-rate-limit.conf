# Include from Nginx's http {} via /etc/nginx/conf.d/*.conf.
# Applied only in location = /web/forecast, not to /v1/* or other services.
# Default 12 requests/minute/IP with a 6-request burst. Backend also enforces
# one concurrent ForecastEngine inference and a total of 30 requests/minute.
limit_req_zone $binary_remote_addr zone=fmpa_public_web_per_ip:1m rate=12r/m;
