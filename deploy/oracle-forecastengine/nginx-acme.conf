# Isolated ACME verification ONLY; 80 never proxies unauthenticated model traffic.
server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    access_log off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/tw01-acme;
        default_type text/plain;
        try_files $uri =404;
        limit_except GET { deny all; }
    }
    # A browser entering http://161.33.19.220 should reach the HTTPS web.
    # Other HTTP endpoints (especially /v1/*) remain unavailable.
    location = / {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        return 301 https://161.33.19.220/web/;
    }
    location / { return 404; }
}
