# Public HTTPS origin; keep port 8767 bound ONLY to 127.0.0.1.
# Public IP SAN certificate via Let's Encrypt shortlived profile (6.6 days).
server {
    listen 443 ssl default_server;
    server_name 161.33.19.220;
    server_tokens off;
    access_log off;
    error_log /var/log/nginx/tw01_forecastengine_error.log warn;
    ssl_certificate /etc/letsencrypt/live/161.33.19.220/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/161.33.19.220/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:2m;
    ssl_session_timeout 10m;
    client_max_body_size 4096;
    client_body_timeout 8s;
    # Nginx must honor the ForecastEngine API JSON error contract even when
    # rejecting an oversized request before FastAPI sees its body.
    error_page 413 = @tw01_payload_too_large;
    keepalive_timeout 5s;
    send_timeout 20s;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control no-store always;
    location @tw01_payload_too_large {
        internal;
        default_type application/json;
        return 413 '{"error":{"code":"payload_too_large","message":"Request body exceeds 4096 bytes."}}';
    }
    location = /healthz {
        proxy_pass http://127.0.0.1:8767;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 20s;
        proxy_send_timeout 5s;
        proxy_buffering off;
    }
    location = /v1/market-quote {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:8767;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 20s;
        proxy_send_timeout 5s;
        proxy_buffering off;
    }
    location = /v1/forecast {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:8767;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 20s;
        proxy_send_timeout 5s;
        proxy_buffering off;
    }
    location / { return 404; }
}
