# Public, unauthenticated browser form ONLY. Do not add Basic Auth here.
# Original /v1/* routes are outside this snippet and remain Bearer-protected.
# Per-client IP limiter is declared separately in http context by
# fresh-market-price-agent-public-web-rate-limit.conf.
location = / {
    return 302 /web/;
}
location = /web {
    return 308 /web/;
}
location = /web/ {
    alias /var/www/fresh-market-price-agent-website/;
    index index.html;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
}
location = /web/index.html {
    alias /var/www/fresh-market-price-agent-website/index.html;
    default_type text/html;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
}
location = /web/app.js {
    alias /var/www/fresh-market-price-agent-website/app.js;
    default_type application/javascript;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
}
location = /web/style.css {
    alias /var/www/fresh-market-price-agent-website/style.css;
    default_type text/css;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
}
location @fmpa_web_rate_limit_error {
    internal;
    default_type application/json;
    return 429 '{"error":{"code":"rate_limited","message":"查詢過於頻繁，請稍後再試。"}}';
}
location = /web/forecast {
    limit_except POST { deny all; }
    limit_req zone=fmpa_public_web_per_ip burst=6 nodelay;
    limit_req_status 429;
    error_page 429 = @fmpa_web_rate_limit_error;
    proxy_pass http://127.0.0.1:8767/site/forecast;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    # Do not forward any browser-provided Authorization to the origin API.
    proxy_set_header Authorization "";
    proxy_connect_timeout 2s;
    proxy_read_timeout 20s;
    proxy_send_timeout 5s;
    proxy_buffering off;
    add_header Cache-Control no-store always;
    add_header X-Content-Type-Options nosniff always;
}
