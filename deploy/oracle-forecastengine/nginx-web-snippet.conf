# Inject inside the existing, verified 443 TLS server block.
# The /v1/* API is deliberately unchanged and keeps its independent Bearer auth.
location = / {
    return 302 /web/;
}
location = /web {
    return 308 /web/;
}
location = /web/ {
    include /etc/nginx/snippets/tw01-web-auth.conf;
    alias /var/www/tw01-website/;
    index index.html;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
}
location = /web/index.html {
    include /etc/nginx/snippets/tw01-web-auth.conf;
    alias /var/www/tw01-website/index.html;
    default_type text/html;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
}
location = /web/app.js {
    include /etc/nginx/snippets/tw01-web-auth.conf;
    alias /var/www/tw01-website/app.js;
    default_type application/javascript;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
}
location = /web/style.css {
    include /etc/nginx/snippets/tw01-web-auth.conf;
    alias /var/www/tw01-website/style.css;
    default_type text/css;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
}
location = /web/forecast {
    include /etc/nginx/snippets/tw01-web-auth.conf;
    limit_except POST { deny all; }
    proxy_pass http://127.0.0.1:8767/site/forecast;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    # Never forward the browser's Basic-Auth credential into Python.
    proxy_set_header Authorization "";
    proxy_connect_timeout 2s;
    proxy_read_timeout 20s;
    proxy_send_timeout 5s;
    proxy_buffering off;
    add_header Cache-Control no-store always;
    add_header X-Content-Type-Options nosniff always;
}
