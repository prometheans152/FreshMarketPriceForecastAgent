[Service]
# Overlay mounts a protected HTML form on the unchanged verified API.
# Frozen release files, origin Bearer routing and ML artifacts are untouched.
Environment=PYTHONPATH=/opt/tw01-forecastengine/current/src:/opt/tw01-forecastengine/current/deploy/oracle-forecastengine
ExecStart=
ExecStart=/opt/tw01-forecastengine/venv/bin/python -m uvicorn oracle_web_site:app --app-dir /opt/tw01-forecastengine-web/site_overlay --host 127.0.0.1 --port 8767 --workers 1 --no-access-log --log-level warning --timeout-keep-alive 4
